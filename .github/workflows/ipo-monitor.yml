name: IPO GMP Monitor

on:
  schedule:
    - cron: '30 3 * * *'   # 9:00 AM IST (UTC+5:30) = 03:30 UTC
  workflow_dispatch:         # Manual trigger

permissions:
  contents: write

jobs:
  check-gmp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium browser
        run: npx playwright install chromium --with-deps

      - name: Build TypeScript
        run: npm run build

      - name: Run IPO GMP monitor
        run: node dist/index.js
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO:  ${{ vars.ALERT_TO }}
          GMP_THRESHOLD: ${{ vars.GMP_THRESHOLD }}

      - name: Keep workflow alive
        run: |
          # GitHub disables scheduled workflows after 60 days of repo inactivity.
          # Push an empty commit only if the last commit is older than 45 days.
          last_commit=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_days=$(( (now - last_commit) / 86400 ))
          echo "Last commit was ${age_days} day(s) ago."
          if [ "$age_days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep scheduled workflow alive"
            git push
          else
            echo "Repo active recently — no keepalive commit needed."
          fi
